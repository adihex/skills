name: Herdr compatibility monitor

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install latest stable Pi and Herdr in isolation
        run: |
          npm install --global @earendil-works/pi-coding-agent@latest
          # Herdr's official installer/package must remain the single installation source.
          curl -fsSL https://herdr.dev/install.sh | sh
      - name: Run deterministic contract checks
        run: python3 -m unittest discover -s tests -v
      - name: Capture and check installed contract
        run: |
          python3 skills/herdr-pi-team/scripts/pi-team-herdr doctor
          python3 skills/herdr-pi-team/scripts/pi-team-herdr compatibility check
          python3 skills/herdr-pi-team/scripts/pi-team-herdr docs check
      - name: Open or update drift issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Herdr/Pi compatibility drift detected';
            const body = `Weekly compatibility monitor detected a contract failure.\n\nReview the failed run for previous/current versions, sanitized capability diff, failing operations, affected wrapper commands, and required adapter/SKILL changes. Do not auto-merge or publish compatibility updates.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'compatibility-drift'});
            if (issues.length) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['compatibility-drift']});

  prerelease:
    if: github.event_name == 'workflow_dispatch'
    needs: stable
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: echo 'Install prereleases explicitly here; this non-blocking job never publishes changes.'
